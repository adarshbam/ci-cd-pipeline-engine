name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: TypeScript Build
        run: npm run build

      - name: Install frontend dependencies
        run: npm --prefix dashboard ci

      - name: Frontend Dashboard Build
        run: npm --prefix dashboard run build

  test-suite:
    name: Test Suite & Security
    runs-on: ubuntu-latest
    needs: [typecheck-and-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Core Test Suite
        run: npm test

      - name: Run Security Tests
        run: npm run test:security

      - name: Run Persistence & Recovery Tests
        run: npm run test:persistence

      - name: Run Stress & Concurrency Tests
        run: npm run test:stress
